{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="auth-panel">
  <h1>Create account</h1>
  <form method="post" class="stack">
    {{ form.hidden_tag() }}
    <label>Email {{ form.email(autocomplete="email") }}</label>
    <label>Password {{ form.password(autocomplete="new-password") }}</label>
    <label>Confirm password {{ form.confirm_password(autocomplete="new-password") }}</label>
    {{ form.submit(class_="primary") }}
  </form>
</section>
{% endblock %}

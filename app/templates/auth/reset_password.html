{% extends "base.html" %}
{% block title %}Set password{% endblock %}
{% block content %}
<section class="auth-panel">
  <h1>Set a new password</h1>
  <form method="post" class="stack">
    {{ form.hidden_tag() }}
    <label>Password {{ form.password(autocomplete="new-password") }}</label>
    <label>Confirm password {{ form.confirm_password(autocomplete="new-password") }}</label>
    {{ form.submit(class_="primary") }}
  </form>
</section>
{% endblock %}

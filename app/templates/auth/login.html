{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-panel">
  <h1>Log in</h1>
  <form method="post" class="stack">
    {{ form.hidden_tag() }}
    <label>Email {{ form.email(autocomplete="email") }}</label>
    <label>Password {{ form.password(autocomplete="current-password") }}</label>
    <label class="check">{{ form.remember() }} <span>Remember me</span></label>
    {{ form.submit(class_="primary") }}
  </form>
  <p><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p>
</section>
{% endblock %}

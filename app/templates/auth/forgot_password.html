{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="auth-panel">
  <h1>Reset password</h1>
  <form method="post" class="stack">
    {{ form.hidden_tag() }}
    <label>Email {{ form.email(autocomplete="email") }}</label>
    {{ form.submit(class_="primary") }}
  </form>
  {% if reset_token %}
    <p class="dev-token">Dev reset token: <a href="{{ url_for('auth.reset_password', token=reset_token) }}">reset link</a></p>
  {% endif %}
</section>
{% endblock %}
